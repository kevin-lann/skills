<title>Invite a teammate</title>
<style>
  html, body { margin: 0; background: #f1efe9; }
  body { -webkit-font-smoothing: antialiased; }
  .fk-page {
    box-sizing: border-box;
    display: flex;
    align-items: flex-start;
    min-height: 100vh;
    padding: 48px 40px;
  }
  .fk-page > .fk { margin: 0 auto; }
  @media (max-width: 700px) { .fk-page { padding: 16px; } }
  @media print { html, body, .fk-page { background: #fff; } .fk-page { padding: 0; } }
</style>
<style>
/* Flow Kit — visual system. Warm paper, ink, hairline geometry, one accent. */

.fk {
  --fk-bg: #fbfaf7;
  --fk-surface: #ffffff;
  --fk-ink: #191814;
  --fk-muted: #6d6960;
  --fk-border: #e5e1d8;
  --fk-line: #b8b3a7;
  --fk-accent: var(--fk-accent-light, #266b57);
  --fk-on-accent: #ffffff;
  --fk-shadow: 0 1px 2px rgba(28, 25, 20, 0.045), 0 14px 30px -20px rgba(28, 25, 20, 0.3);
  --fk-shadow-raised: 0 1px 2px rgba(28, 25, 20, 0.06), 0 18px 36px -18px rgba(28, 25, 20, 0.34);
  --fk-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;

  position: relative;
  display: inline-block;
  box-sizing: border-box;
  max-width: 100%;
  padding: 42px 44px 30px;
  border: 1px solid var(--fk-border);
  border-radius: 18px;
  background: var(--fk-bg);
  color: var(--fk-ink);
  font-family: var(--fk-font);
  font-size: 14px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-variant-numeric: tabular-nums;
}

.fk *,
.fk *::before,
.fk *::after { box-sizing: border-box; }

.fk[data-theme="dark"] {
  --fk-bg: #111214;
  --fk-surface: #191b1f;
  --fk-ink: #f1efea;
  --fk-muted: #a09c93;
  --fk-border: #2b2e34;
  --fk-line: #4a4f58;
  --fk-accent: var(--fk-accent-dark, #58b394);
  --fk-on-accent: #0d0e0f;
  --fk-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 18px 34px -22px rgba(0, 0, 0, 0.7);
  --fk-shadow-raised: 0 1px 2px rgba(0, 0, 0, 0.4), 0 22px 40px -20px rgba(0, 0, 0, 0.8);
}

@media (prefers-color-scheme: dark) {
  .fk[data-theme="auto"] {
    --fk-bg: #111214;
    --fk-surface: #191b1f;
    --fk-ink: #f1efea;
    --fk-muted: #a09c93;
    --fk-border: #2b2e34;
    --fk-line: #4a4f58;
    --fk-accent: var(--fk-accent-dark, #58b394);
    --fk-on-accent: #0d0e0f;
    --fk-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 18px 34px -22px rgba(0, 0, 0, 0.7);
    --fk-shadow-raised: 0 1px 2px rgba(0, 0, 0, 0.4), 0 22px 40px -20px rgba(0, 0, 0, 0.8);
  }
}

/* ---------------------------------------------------------------- header */

.fk-head { margin: 0 0 26px; max-width: 74ch; }
.fk-title {
  margin: 0;
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -0.022em;
  line-height: 1.25;
  color: var(--fk-ink);
}
.fk-sub {
  margin: 7px 0 0;
  font-size: 13px;
  line-height: 1.55;
  letter-spacing: -0.002em;
  color: var(--fk-muted);
  max-width: 68ch;
}

/* ---------------------------------------------------------------- canvas */

.fk-canvas { position: relative; }
.fk-group-layer, .fk-label-layer, .fk-node-layer { position: absolute; inset: 0; }
.fk-label-layer, .fk-node-layer { pointer-events: none; }
.fk-edges { position: absolute; inset: 0; overflow: visible; }

/* ----------------------------------------------------------------- groups */

.fk-group {
  position: absolute;
  border: 1px solid color-mix(in srgb, var(--g-tone, #7d786d) 17%, transparent);
  border-radius: 18px;
  background: color-mix(in srgb, var(--g-tone, #7d786d) 4%, transparent);
}
.fk-group[data-tone="ink"]  { --g-tone: #4a4640; }
.fk-group[data-tone="pine"] { --g-tone: #2c6b57; }
.fk-group[data-tone="clay"] { --g-tone: #a9542f; }
.fk-group[data-tone="steel"]{ --g-tone: #3a5f7d; }
.fk-group[data-tone="amber"]{ --g-tone: #8a6414; }

.fk-group-label {
  position: absolute;
  top: 10px;
  left: 16px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 550;
  letter-spacing: 0.002em;
  color: color-mix(in srgb, var(--g-tone, #6d6960) 72%, var(--fk-ink));
  opacity: 0.9;
}
.fk-group-label .fk-ico { opacity: 0.75; }

/* ------------------------------------------------------------------ nodes */

.fk-node {
  --tone: #46423b;
  position: absolute;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0 14px;
  border: 1px solid var(--fk-border);
  border-radius: 12px;
  background: var(--fk-surface);
  box-shadow: var(--fk-shadow);
  pointer-events: auto;
  transition: box-shadow 0.18s ease, border-color 0.18s ease, opacity 0.18s ease, transform 0.18s ease;
  animation: fk-rise 0.5s cubic-bezier(0.2, 0.7, 0.3, 1) both;
  animation-delay: var(--d, 0ms);
}

.fk-node[data-tone="ink"]   { --tone: #4a4640; }
.fk-node[data-tone="pine"]  { --tone: #2c6b57; }
.fk-node[data-tone="clay"]  { --tone: #a9542f; }
.fk-node[data-tone="steel"] { --tone: #3a5f7d; }
.fk-node[data-tone="amber"] { --tone: #8a6414; }
.fk-node[data-tone="ok"]    { --tone: #3b7050; }
.fk-node[data-tone="danger"]{ --tone: #a4402f; }
.fk-node[data-tone="accent"]{ --tone: var(--fk-accent); }

.fk[data-theme="dark"] .fk-node[data-tone="ink"]   { --tone: #b6b1a6; }
.fk[data-theme="dark"] .fk-node[data-tone="pine"]  { --tone: #5fb79b; }
.fk[data-theme="dark"] .fk-node[data-tone="clay"]  { --tone: #d98a61; }
.fk[data-theme="dark"] .fk-node[data-tone="steel"] { --tone: #7faed1; }
.fk[data-theme="dark"] .fk-node[data-tone="amber"] { --tone: #d2ac5a; }
.fk[data-theme="dark"] .fk-node[data-tone="ok"]    { --tone: #6fbe8c; }
.fk[data-theme="dark"] .fk-node[data-tone="danger"]{ --tone: #e08472; }

.fk-icon {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 31px;
  height: 31px;
  border-radius: 9px;
  color: var(--tone);
  background: color-mix(in srgb, var(--tone) 10%, transparent);
}
.fk[data-theme="dark"] .fk-icon { background: color-mix(in srgb, var(--tone) 16%, transparent); }

.fk-dot {
  flex: 0 0 auto;
  width: 6px;
  height: 6px;
  margin: 0 4px;
  border-radius: 50%;
  background: var(--tone);
  opacity: 0.55;
}

.fk-node-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fk-node-title {
  font-size: 13px;
  font-weight: 550;
  letter-spacing: -0.008em;
  line-height: 1.3;
  color: var(--fk-ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.fk-node-sub {
  font-size: 10.5px;
  font-weight: 450;
  letter-spacing: 0.002em;
  line-height: 1.3;
  color: var(--fk-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.fk-node[data-emphasis="accent"] {
  border-color: color-mix(in srgb, var(--fk-accent) 42%, var(--fk-border));
  background: color-mix(in srgb, var(--fk-accent) 4%, var(--fk-surface));
}
.fk-node[data-emphasis="muted"] { box-shadow: none; opacity: 0.82; }
.fk-node:hover { box-shadow: var(--fk-shadow-raised); }

.fk-badge {
  position: absolute;
  top: -8px;
  left: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 17px;
  height: 17px;
  padding: 0 4px;
  border-radius: 5px;
  background: var(--fk-accent);
  color: var(--fk-on-accent);
  font-size: 9.5px;
  font-weight: 650;
  letter-spacing: 0.01em;
  line-height: 1;
}

/* ------------------------------------------------------------------ edges */

.fk-edge { animation: fk-fade 0.45s ease both; animation-delay: 60ms; }
.fk-edge-line {
  fill: none;
  stroke: var(--fk-line);
  stroke-width: 1.25;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: stroke 0.18s ease, opacity 0.18s ease;
}
.fk-edge--accent .fk-edge-line { stroke: var(--fk-accent); stroke-width: 1.6; }
.fk-edge--steel .fk-edge-line { stroke: #5a7f9d; }
.fk-edge--danger .fk-edge-line { stroke: #a4402f; }
.fk-edge--dashed .fk-edge-line { stroke-dasharray: 4 5; }
.fk-edge--dotted .fk-edge-line { stroke-dasharray: 0.1 4.5; }

.fk[data-theme="dark"] .fk-edge--steel .fk-edge-line { stroke: #7faed1; }
.fk[data-theme="dark"] .fk-edge--danger .fk-edge-line { stroke: #d9836f; }

.fk-arrow--neutral { fill: var(--fk-line); }
.fk-arrow--accent { fill: var(--fk-accent); }
.fk-arrow--steel { fill: #5a7f9d; }
.fk-arrow--danger { fill: #a4402f; }
.fk-arrow--ok { fill: #3b7050; }
.fk[data-theme="dark"] .fk-arrow--steel { fill: #7faed1; }
.fk[data-theme="dark"] .fk-arrow--danger { fill: #d9836f; }

.fk-edge-label {
  position: absolute;
  transform: translate(-50%, -50%);
  padding: 1px 5px 2px;
  border-radius: 4px;
  background: var(--fk-bg);
  color: var(--fk-muted);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.005em;
  line-height: 1.2;
  white-space: nowrap;
}
.fk-edge-label.is-above { transform: translate(-50%, -100%) translateY(-4px); }
.fk-edge-label.is-start { transform: translate(0, -50%); }

/* ------------------------------------------------------------------ focus */

.fk-canvas[data-focus] .fk-node { opacity: 0.3; }
.fk-canvas[data-focus] .fk-node.is-on { opacity: 1; }
.fk-canvas[data-focus] .fk-node.is-on { box-shadow: var(--fk-shadow-raised); }
.fk-canvas[data-focus] .fk-edge { opacity: 0.14; }
.fk-canvas[data-focus] .fk-edge.is-on { opacity: 1; }
.fk-canvas[data-focus] .fk-edge.is-on .fk-edge-line { stroke: var(--fk-ink); }

/* ----------------------------------------------------------------- legend */

.fk-foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 22px;
  margin-top: 20px;
  padding-top: 14px;
  border-top: 1px solid color-mix(in srgb, var(--fk-border) 70%, transparent);
}
.fk-legend { display: flex; flex-wrap: wrap; gap: 8px 20px; }
.fk-legend-item {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  color: var(--fk-muted);
  letter-spacing: 0.002em;
}
.fk-legend-line {
  width: 20px;
  height: 0;
  border-top: 1.25px solid var(--fk-line);
  position: relative;
}
.fk-legend-line::after {
  content: "";
  position: absolute;
  right: -1px;
  top: -3.5px;
  width: 5px;
  height: 5px;
  border-top: 1.25px solid var(--fk-line);
  border-right: 1.25px solid var(--fk-line);
  transform: rotate(45deg);
}
.fk-legend-line.is-dashed { border-top-style: dashed; }
.fk-legend-line.is-dashed::after { border-top-style: dashed; border-right-style: dashed; }
.fk-legend-line[data-kind="async"] { border-color: #5a7f9d; }
.fk-legend-line[data-kind="async"]::after { border-color: #5a7f9d; }
.fk-legend-line[data-kind="error"] { border-color: #a4402f; }
.fk-legend-line[data-kind="error"]::after { border-color: #a4402f; }
.fk-legend-line[data-kind="back"] { opacity: 0.75; }

.fk-note {
  margin: 0;
  font-size: 11px;
  color: var(--fk-muted);
  opacity: 0.85;
}
.fk-legend + .fk-note {
  margin-left: auto;
  text-align: right;
}

/* --------------------------------------------------------------- motion */

@keyframes fk-rise {
  from { opacity: 0; transform: translateY(7px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fk-fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .fk-node, .fk-edge { animation: none; }
  .fk-node { transition: none; }
}

/* ----------------------------------------------------------------- print */

@media print {
  .fk { box-shadow: none; }
  .fk-node { animation: none; }
  .fk-edge { animation: none; }
}

</style>

    });
    (spec.nodes || []).forEach(function (n) {
      Object.keys(n).forEach(function (k) {

      });
      if (n.tone && tones.indexOf(n.tone) === -1) problems.push({ level: 'error', code: 'unknown-tone', msg: 'Node "' + n.id + '" has unknown tone "' + n.tone + '". Use ink, pine, clay, steel, amber, ok, danger or accent.' });
      if (n.label && n.label.length > 26) problems.push({ level: 'warning', code: 'long-name', msg: 'Node title "' + n.label + '" will be truncated. Keep it under ~26 characters.' });

      });

    });

    if (spec.theme && ['light', 'dark', 'auto'].indexOf(spec.theme) === -1) problems.push({ level: 'error', code: 'bad-theme', msg: 'theme must be "light", "dark" or "auto".' });

      (spec.nodes || []).forEach(function (n) {

            });
          }

      if (e.labelBox) {
        boxes.forEach(function (b) {
          var lb = e.labelBox;
          if (lb.x < b.x + b.w && lb.x + lb.w > b.x && lb.y < b.y + b.h && lb.y + lb.h > b.y) {
            problems.push({ level: 'warning', code: 'label-over-node', msg: 'Label "' + e.label + '" overlaps node "' + b.id + '".' });

      for (var i = 1; i < e.pts.length; i++) {
        var p = e.pts[i - 1], q = e.pts[i];
        if (Math.abs(p.x - q.x) < 0.4 && Math.abs(p.y - q.y) < 0.4) continue;
        segs.push({ e: e, p: p, q: q });
      }
    });
    for (var i = 0; i < segs.length; i++) {
      for (var j = i + 1; j < segs.length; j++) {
        var A = segs[i], B = segs[j];
        if (A.e === B.e) continue;
        if (A.p.x === B.p.x && Math.abs(A.p.x - B.p.x) < 0.4 && A.p.y !== B.p.y) {
          var loA = Math.min(A.p.y, A.q.y), hiA = Math.max(A.p.y, A.q.y);
          var loB = Math.min(B.p.y, B.q.y), hiB = Math.max(B.p.y, B.q.y);
          if (Math.min(hiA, hiB) - Math.max(loA, loB) > 4) {
            problems.push({
              level: 'error', code: 'edge-overlap',
              msg: 'Edges ' + A.e.from + ' → ' + A.e.to + ' and ' + B.e.from + ' → ' + B.e.to + ' run on top of each other.'
            });
          }
        }
        if (A.p.y === B.p.y && Math.abs(A.p.y - B.p.y) < 0.4 && A.p.x !== B.p.x) {
          var loC = Math.min(A.p.x, A.q.x), hiC = Math.max(A.p.x, A.q.x);
          var loD = Math.min(B.p.x, B.q.x), hiD = Math.max(B.p.x, B.q.x);
          if (Math.min(hiC, hiD) - Math.max(loC, loD) > 4) {
            problems.push({
              level: 'error', code: 'edge-overlap',
              msg: 'Edges ' + A.e.from + ' → ' + A.e.to + ' and ' + B.e.from + ' → ' + B.e.to + ' run on top of each other.'
            });
          }
        }
      }

    (lay.edges || []).forEach(function (e) {
      if (e.label && e.label.length > 28) {
        problems.push({ level: 'warning', code: 'long-label', msg: 'Edge label is long; 1–3 words reads best: "' + e.label + '"' });
      }
      if (e.label && !e.labelBox && !e.same) {
        problems.push({ level: 'warning', code: 'label-dropped', msg: 'No room for label "' + e.label + '" on ' + e.from + ' → ' + e.to + '.' });
      }
    });

    if (lay.nodes.length > 12) {
      problems.push({ level: 'warning', code: 'too-many-nodes', msg: lay.nodes.length + ' nodes is past the comfortable limit (8–10). Split the story.' });
    }
    if (lay.stats.crossings > Math.max(2, lay.nodes.length / 3)) {
      problems.push({ level: 'info', code: 'crossings', msg: lay.stats.crossings + ' edge crossings. Reordering nodes or using a rail may reduce them.' });
    }

      problems.push({ level: 'warning', code: 'wide', msg: 'Diagram is ' + lay.width + 'px wide; collapse a step or use direction: "TB".' });
    }

    var errors = problems.filter(function (p) { return p.level === 'error'; });
    return {
      ok: errors.length === 0,
      layout: lay,
      problems: problems,
      stats: lay.stats,
      summary: errors.length + ' error(s), ' + (problems.length - errors.length) + ' note(s)'

  }

  /* Auto direction: side-by-side reads best until the chain gets too long. */
  function layout(spec) {

<script>
/* Flow Kit — renderer. Turns a spec into HTML + SVG. Requires engine.js and icons.js. */
(function (root) {
  'use strict';

  var ENG = root.FlowEngine;
  var ICONS = root.FLOW_ICONS || {};

  var TONES = {
    ink:   { light: '#3F3B34', dark: '#D8D4CB' },
    pine:  { light: '#2C6B57', dark: '#5FB79B' },
    clay:  { light: '#A9542F', dark: '#D98A61' },
    amber: { light: '#8A6414', dark: '#D2AC5A' },
    steel: { light: '#3A5F7D', dark: '#7FAED1' },
    ok:    { light: '#3B7050', dark: '#6FBE8C' },
    danger:{ light: '#A4402F', dark: '#E08472' }
  };

  var ACCENTS = {
    pine:  { light: '#266B57', dark: '#58B394' },
    clay:  { light: '#A0512D', dark: '#D98F66' },
    steel: { light: '#345B7A', dark: '#83B0D0' },
    ink:   { light: '#2B2924', dark: '#E7E3DA' },
    amber: { light: '#8A6414', dark: '#D6B166' }
  };

  function el(tag, cls, parent) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (parent) parent.appendChild(n);
    return n;
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function iconSvg(name, size) {
    var body = ICONS[name];
    if (!body) return '';
    return '<svg class="fk-ico" width="' + (size || 16) + '" height="' + (size || 16) +
      '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
  }

  /* --------------------------------------------------------- edge paths */

  function cleanPts(pts) {
    var out = [];
    pts.forEach(function (p) {
      var last = out[out.length - 1];
      if (last && Math.abs(last.x - p.x) < 0.01 && Math.abs(last.y - p.y) < 0.01) return;
      out.push(p);
    });
    return out;
  }

  function roundedPath(pts, radius) {
    pts = cleanPts(pts);
    if (pts.length < 2) return '';
    var d = 'M ' + pts[0].x + ' ' + pts[0].y;
    for (var i = 1; i < pts.length - 1; i++) {
      var prev = pts[i - 1], cur = pts[i], next = pts[i + 1];
      var d1 = Math.hypot(cur.x - prev.x, cur.y - prev.y);
      var d2 = Math.hypot(next.x - cur.x, next.y - cur.y);
      var r = Math.min(radius, d1 / 2, d2 / 2);
      if (r < 0.5) { d += ' L ' + cur.x + ' ' + cur.y; continue; }
      var a = { x: cur.x + (prev.x - cur.x) * (r / d1), y: cur.y + (prev.y - cur.y) * (r / d1) };
      var b = { x: cur.x + (next.x - cur.x) * (r / d2), y: cur.y + (next.y - cur.y) * (r / d2) };
      d += ' L ' + round(a.x) + ' ' + round(a.y) + ' Q ' + cur.x + ' ' + cur.y + ' ' + round(b.x) + ' ' + round(b.y);
    }
    var last = pts[pts.length - 1];
    d += ' L ' + round(last.x) + ' ' + round(last.y);
    return d;
  }

  function round(n) { return Math.round(n * 100) / 100; }

  /* tone resolution */
  function edgeTone(e) {
    if (e.kind === 'error') return 'danger';
    if (e.kind === 'async') return 'steel';
    if (e.tone) return e.tone;
    return 'neutral';

  function render(spec, opts) {
    opts = opts || {};
    spec = JSON.parse(JSON.stringify(spec));
    var lay = opts.layout || ENG.layout(spec);
    var accentName = ACCENTS[spec.accent] ? spec.accent : 'pine';
    var accent = ACCENTS[accentName];
    var theme = spec.theme || 'light';

    var mount = opts.target || document.getElementById(spec.mount || 'diagram') || document.body;
    var rootEl = el('div', 'fk' + (spec.className ? ' ' + spec.className : ''));

    rootEl.setAttribute('aria-label', spec.title || 'Flow diagram');
    rootEl.style.setProperty('--fk-accent-light', accent.light);
    rootEl.style.setProperty('--fk-accent-dark', accent.dark);

    if (theme === 'auto') rootEl.dataset.theme = 'auto';

    /* header */
    if (spec.title || spec.subtitle) {
      var head = el('header', 'fk-head', rootEl);
      if (spec.title) {
        var h = el('h1', 'fk-title', head);
        h.textContent = spec.title;
      }
      if (spec.subtitle) {
        var sub = el('p', 'fk-sub', head);
        sub.textContent = spec.subtitle;
      }

    canvas.style.width = lay.width + 'px';
    canvas.style.height = lay.height + 'px';

    lay.groups.forEach(function (g) {
      var gd = el('div', 'fk-group', groupLayer);
      gd.style.left = g.x + 'px';
      gd.style.top = g.y + 'px';
      gd.style.width = g.w + 'px';
      gd.style.height = g.h + 'px';
      if (g.tone) gd.dataset.tone = g.tone;
      var lab = el('div', 'fk-group-label', gd);
      if (g.icon) lab.insertAdjacentHTML('beforeend', iconSvg(g.icon, 13));
      var span = el('span', '', lab);
      span.textContent = g.label;
    });

    /* edges */
    var svgNS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('class', 'fk-edges');
    svg.setAttribute('width', lay.width);
    svg.setAttribute('height', lay.height);
    svg.setAttribute('viewBox', '0 0 ' + lay.width + ' ' + lay.height);
    canvas.appendChild(svg);

    var defs = document.createElementNS(svgNS, 'defs');
    svg.appendChild(defs);
    ['neutral', 'accent', 'danger', 'steel', 'ok'].forEach(function (tone) {
      var m = document.createElementNS(svgNS, 'marker');
      m.setAttribute('id', 'fk-arrow-' + tone);
      m.setAttribute('viewBox', '0 0 8 8');
      m.setAttribute('refX', '7');
      m.setAttribute('refY', '4');
      m.setAttribute('markerWidth', '7');

      var p = document.createElementNS(svgNS, 'path');
      p.setAttribute('d', 'M0.6,1.1 L7,4 L0.6,6.9 L1.9,4 Z');

      m.appendChild(p);
      defs.appendChild(m);

    var edgeEls = [];
    lay.edges.forEach(function (e) {
      var tone = e.tone === 'accent' ? 'accent' : edgeTone(e);
      var g = document.createElementNS(svgNS, 'g');
      g.setAttribute('class', 'fk-edge fk-edge--' + tone + (e.style ? ' fk-edge--' + e.style : ''));
      g.setAttribute('data-from', e.from);

    });

    var labelLayer = el('div', 'fk-label-layer', canvas);
    edgeEls.forEach(function (item) {
      var e = item.e;
      if (!e.label || !e.labelPos || e.labelPos.hidden) return;
      var pill = el('div', 'fk-edge-label', labelLayer);
      pill.style.left = e.labelPos.x + 'px';
      pill.style.top = e.labelPos.y + 'px';
      if (e.labelPos.above) pill.classList.add('is-above');
      if (e.labelPos.anchor === 'start') pill.classList.add('is-start');
      pill.textContent = e.label;
    });

    /* nodes */
    var nodeLayer = el('div', 'fk-node-layer', canvas);
    var nodeEls = {};
    var step = 0;
    lay.nodes.forEach(function (n, i) {
      var tone = n.tone || (n.emphasis === 'accent' ? 'accent' : 'ink');
      if (STRING_TONES.indexOf(tone) === -1) tone = 'ink';
      var d = el('div', 'fk-node', nodeLayer);
      d.style.left = n.x + 'px';
      d.style.top = n.y + 'px';
      d.style.width = n.w + 'px';
      d.style.height = n.h + 'px';
      d.style.setProperty('--d', (i * 36 + 40) + 'ms');
      d.dataset.id = n.id;
      d.dataset.tone = tone;
      if (n.emphasis === 'accent') d.dataset.emphasis = 'accent';
      if (n.emphasis === 'muted') d.dataset.emphasis = 'muted';

      if (n.icon) {
        var ib = el('span', 'fk-icon', d);
        ib.innerHTML = iconSvg(n.icon, 17);
      } else {
        el('span', 'fk-dot', d);
      }
      var body = el('span', 'fk-node-text', d);
      var t = el('span', 'fk-node-title', body);
      t.textContent = n.label;
      if (n.sub) {
        var s = el('span', 'fk-node-sub', body);
        s.textContent = n.sub;
      }
      if (spec.number && (!n.spec || n.spec.badge !== false)) {
        step += 1;
        var b = el('span', 'fk-badge', d);
        b.textContent = (n.spec && n.spec.badge) || step;
      }
      nodeEls[n.id] = d;
    });

    /* hover focus */
    var edgesByNode = {};
    lay.edges.forEach(function (e) {
      (edgesByNode[e.from] = edgesByNode[e.from] || []).push(e);
      (edgesByNode[e.to] = edgesByNode[e.to] || []).push(e);
    });
    Object.keys(nodeEls).forEach(function (id) {
      var d = nodeEls[id];
      d.addEventListener('mouseenter', function () {
        var on = {};
        on[id] = true;
        (edgesByNode[id] || []).forEach(function (e) { on[e.from] = true; on[e.to] = true; });
        canvas.dataset.focus = '1';
        Object.keys(nodeEls).forEach(function (k) {
          nodeEls[k].classList.toggle('is-on', !!on[k]);
        });
        edgeEls.forEach(function (it) {
          it.g.classList.toggle('is-on', !!on[it.e.from] && !!on[it.e.to]);
        });
      });
      d.addEventListener('mouseleave', function () {
        delete canvas.dataset.focus;
        Object.keys(nodeEls).forEach(function (k) { nodeEls[k].classList.remove('is-on'); });
        edgeEls.forEach(function (it) { it.g.classList.remove('is-on'); });
      });
    });

    /* legend + footnote */
    var usedKinds = {};
    lay.edges.forEach(function (e) {
      usedKinds[e.kind] = true;
      if (e.back) usedKinds.back = true;
    });
    var legendItems = spec.legend === true ? autoLegend(usedKinds) : Array.isArray(spec.legend) ? spec.legend : [];
    if (legendItems.length || spec.footnote) {
      var foot = el('footer', 'fk-foot', rootEl);
      if (legendItems.length) {
        var legend = el('div', 'fk-legend', foot);
        legendItems.forEach(function (item) {
          var li = el('span', 'fk-legend-item', legend);
          var sw = el('span', 'fk-legend-line', li);
          sw.dataset.kind = item.kind || 'sync';
          if (item.dashed) sw.classList.add('is-dashed');
          var txt = el('span', '', li);
          txt.textContent = item.label;
        });
      }
      if (spec.footnote) {
        var note = el('p', 'fk-note', foot);
        note.textContent = spec.footnote;
      }
    }

    mount.appendChild(rootEl);
    if (opts.audit) root.__FLOW_REPORT__ = ENG.audit(spec, opts);
    return rootEl;
  }

  var STRING_TONES = ['ink', 'pine', 'clay', 'amber', 'steel', 'ok', 'danger', 'accent'];

  function autoLegend(kinds) {
    var map = {
      sync: { label: 'Request', kind: 'sync' },
      async: { label: 'Async / event', kind: 'async', dashed: true },
      error: { label: 'Failure path', kind: 'error', dashed: true },
      back: { label: 'Return / retry', kind: 'back', dashed: true }
    };
    var order = ['sync', 'async', 'error', 'back'];
    var out = [];
    order.forEach(function (k) { if (kinds[k] && map[k]) out.push(map[k]); });
    return out.length > 1 ? out : [];
  }

  root.FlowKit = { render: render, audit: function (spec, opts) { return ENG.audit(spec, opts); }, icons: ICONS };
})(typeof globalThis !== 'undefined' ? globalThis : this);
